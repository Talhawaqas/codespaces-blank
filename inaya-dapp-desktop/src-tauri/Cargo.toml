[package]
name = "inaya-dapp-desktop"
version = "0.1.0"
description = "Inaya Network -- installable desktop wrapper around the existing dApp (faucet, node registry, staking, KYC, referrals, watcher pioneer). No new features: same dApp, rendered from the same URL, with native OS integration (tray, menu, auto-update) around it. Wallet connection uses WalletConnect (no browser extension needed inside a native webview) -- MetaMask/Trust/Coinbase remain browser-only."
authors = ["Inaya Network"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
