[package]
name = "inaya-bridge-solana"
version = "0.1.0"
description = "Inaya Network cross-chain bridge -- Solana (non-EVM spoke) side, SOW-1"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "inaya_bridge_solana"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
solana-keccak-hasher = "3.1.0"
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"

[profile.release]
overflow-checks = true
