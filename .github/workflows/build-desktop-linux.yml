name: Build Desktop (Linux)

on:
  push:
    branches: [main]
    paths:
      - "inaya-desktop/**"
      - ".github/workflows/build-desktop-linux.yml"
  workflow_dispatch: # lets you trigger this manually from GitHub's Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inaya-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SOURCE_DATE_EPOCH below needs the real commit timestamp, not a shallow clone's

      # Verifiable Inaya Client SOW: two of the cheapest, most common sources of build
      # non-determinism -- pinned via rust-toolchain.toml (inaya-desktop/src-tauri/) rather
      # than floating on "stable" (whatever happens to be current on build day), and
      # SOURCE_DATE_EPOCH pinned to the commit being built rather than the wall-clock time
      # the CI runner happened to build it. Full bit-for-bit binary reproducibility would
      # additionally need a fully hermetic build environment (Nix or an equivalently pinned
      # container) -- deliberately not attempted here; see
      # inaya-network-dapp/docs/reproducible-builds-and-verification.md for why that's not
      # judged proportionate for a thin native shell around remotely-loaded content.
      - name: Set up Rust (version pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Pin SOURCE_DATE_EPOCH to the commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Strip the absolute build path out of the compiled binary
        run: echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=." >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inaya-desktop/package-lock.json

      # Tauri's Linux target needs WebKitGTK (the actual webview engine on
      # Linux, unlike Windows which shares the OS's WebView2) plus the usual
      # native-build toolchain -- none of this is present on a bare
      # ubuntu-latest runner by default.
      - name: Install Linux webview + native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build (AppImage + .deb, signed for the auto-updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build

      - name: List actual build output (diagnostic)
        run: find src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.sig" \)

      - name: Upload AppImage + .deb as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inaya-desktop-linux
          path: |
            inaya-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            inaya-desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            inaya-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
