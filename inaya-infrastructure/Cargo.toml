[workspace]
resolver = "2"
members = [
    "crates/inaya-infra-cli",
    "crates/inaya-infra-node",
    "crates/cluster",
    "crates/compute",
    "crates/network",
    "crates/block",
    "crates/messages",
    "crates/certificates",
    "crates/security",
    "crates/telemetry",
    "crates/api-types",
    "crates/loadbalancer",
    "crates/guest-exec",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Inaya Network"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rustls = "0.23"
rcgen = "0.13"
async-nats = "0.37"
nix = { version = "0.29", features = ["process", "fs", "user"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sysinfo = "0.32"
sha2 = "0.10"
russh = "0.45"
russh-keys = "0.45"
rand = "0.8"
